<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BugShield Autonomous SaaS</title>
<style>
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: #0f172a;
    color: #f8fafc;
    margin: 0;
    padding: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
  }
  .card {
    background: #1e293b;
    border: 1px solid #334155;
    border-radius: 20px;
    padding: 40px;
    max-width: 500px;
    text-align: center;
    box-shadow: 0 25px 50px -12px rgba(0,0,0,0.5);
  }
  h1 {
    font-size: 28px;
    margin-bottom: 10px;
    background: linear-gradient(135deg, #38bdf8, #818cf8);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
  }
  p { color: #94a3b8; line-height: 1.6; margin-bottom: 24px; }
  .btn {
    display: inline-block;
    background: #2563eb;
    color: #fff;
    text-decoration: none;
    font-weight: 600;
    padding: 12px 24px;
    border-radius: 10px;
    transition: background 0.2s;
  }
  .btn:hover { background: #1d4ed8; }
</style>
</head>
<body>
  <div class="card">
    <h1>🤖 BugShield SaaS</h1>
    <p>Autonomous AI Multi-Agent Bug Resolution Platform. Integrates with customer web applications via a single-line JavaScript snippet.</p>
    <a href="/dashboard.html" class="btn">Open Vendor Control Dashboard ↗</a>
  </div>
</body>
</html>
